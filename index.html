<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>香港食物價格地圖 · Hong Kong Food Price Map</title>
  <meta name="description" content="按香港18區顯示食物人均價格，數據來自社交媒體貼文的自動抓取。" />
  <link rel="icon" href="img/logo.png" />
  <!-- Apply saved / system theme before first paint to avoid a flash -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("hkfm-theme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+HK:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-bar">
    <div class="app-bar__inner">
      <img class="app-bar__logo" src="img/logo.png" alt="" width="44" height="44" />
      <div class="app-bar__titles">
        <h1 data-i18n="appTitle">香港食物價格地圖</h1>
        <p data-i18n="appSubtitle">按行政區</p>
      </div>
      <div class="app-bar__controls">
        <div class="lang-switch" role="group" data-i18n-aria="langLabel" aria-label="語言">
          <button type="button" data-lang-btn="zh-Hant">繁</button>
          <button type="button" data-lang-btn="zh-Hans">简</button>
          <button type="button" data-lang-btn="en">EN</button>
        </div>
        <button type="button" id="theme-toggle" class="icon-btn" data-i18n-title="themeToDark" title="切換至黑夜模式" aria-label="切換至黑夜模式">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2v-2H2zm18 0h2v-2h-2zM11 2v2h2V2zm0 18v2h2v-2zM4.2 5.6 5.6 4.2 7 5.6 5.6 7zM17 18.4l1.4-1.4 1.4 1.4-1.4 1.4zM18.4 4.2 19.8 5.6 18.4 7 17 5.6zM5.6 19.8 4.2 18.4 5.6 17 7 18.4z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="card map-card">
      <div id="map" role="region" data-i18n-aria="mapAria" aria-label="香港18區地圖"></div>
      <div class="legend" aria-hidden="true">
        <span class="legend__item"><i style="background:#2e7d32"></i><span data-i18n="legendLow">低於 $40</span></span>
        <span class="legend__item"><i style="background:#8bc34a"></i><span data-i18n="legend2">$40–60</span></span>
        <span class="legend__item"><i style="background:#fdd835"></i><span data-i18n="legend3">$60–80</span></span>
        <span class="legend__item"><i style="background:#fb8c00"></i><span data-i18n="legend4">$80–150</span></span>
        <span class="legend__item"><i style="background:#e53935"></i><span data-i18n="legendHigh">高於 $150</span></span>
        <span class="legend__item"><i style="background:#bdbdbd"></i><span data-i18n="legendNone">暫無數據</span></span>
      </div>
    </section>

    <aside class="card list-card">
      <div class="list-card__head">
        <h2 data-i18n="listTitle">各區人均價</h2>
        <span class="hint" data-i18n="listHint">點選地圖或列表</span>
      </div>
      <ul id="district-list" class="district-list"></ul>
    </aside>

    <section class="card detail-card" id="detail" aria-live="polite">
      <div class="detail__placeholder">
        <h2 data-i18n="placeholderTitle">請選擇一個行政區</h2>
        <p data-i18n="placeholderText">點擊地圖上的圓點，或左側列表中的行政區，查看該區的餐廳與社交媒體貼文。</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footerDisclaimer">價格為社交媒體貼文中提取的人均消費估算，僅供參考，並非官方數據。</p>
    <p class="footer__crawl" id="footer-crawl" data-i18n="loading">加載中…</p>
    <nav class="footer__links" aria-label="Links">
      <a href="https://baipon.com" target="_blank" rel="noopener noreferrer" data-i18n="otherProjects">其他項目</a>
      <a href="https://baipin.pw/donate" target="_blank" rel="noopener noreferrer" data-i18n="donate">捐贈我們</a>
      <a href="mailto:root@baipin.pw" data-i18n="reportIssue">報告問題</a>
    </nav>
    <p>
      <img class="footer__wcag" src="img/wcag2.2AA-blue.png" width="88" height="31"
        alt="符合萬維網聯盟有關無障礙網頁設計指引中2A級別的要求" data-i18n-alt="wcagAlt" />
    </p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
