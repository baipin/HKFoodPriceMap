<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>香港食物價格地圖 · Hong Kong Food Price Map</title>
  <meta name="description" content="按香港18區顯示食物人均價格，數據來自搜尋結果及公開 AI 提取。" />
  <link rel="icon" href="img/logo.png" />
  <!-- Apply saved / system theme before first paint to avoid a flash -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("hkfm-theme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+HK:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top app bar (MD3 small) -->
  <header class="app-bar">
    <div class="app-bar__inner">
      <img class="app-bar__logo" src="img/logo.png" alt="" width="40" height="40" />
      <div class="app-bar__titles">
        <h1 data-i18n="appTitle">香港食物價格地圖</h1>
        <p data-i18n="appSubtitle">按行政區</p>
      </div>

      <div class="app-bar__actions">
        <!-- Desktop / tablet: controls live in the app bar -->
        <div class="segmented desktop-only" role="group" data-i18n-aria="langLabel" aria-label="語言">
          <button type="button" class="md-state" data-lang-btn="zh-Hant" aria-pressed="false">
            <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>繁
          </button>
          <button type="button" class="md-state" data-lang-btn="zh-Hans" aria-pressed="false">
            <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>简
          </button>
          <button type="button" class="md-state" data-lang-btn="en" aria-pressed="false">
            <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>EN
          </button>
        </div>
        <button type="button" class="icon-btn md-state desktop-only" data-theme-toggle data-i18n-title="themeToDark" title="切換至黑夜模式" aria-label="切換至黑夜模式">
          <svg class="md-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          <svg class="md-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0-7 0 2m0 16 0 2M2 12h2m16 0h2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M4.22 19.78l1.42-1.42m12.72-12.72 1.42-1.42" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <!-- Phones: opens the navigation drawer holding language and theme -->
        <button type="button" class="icon-btn md-state drawer-trigger" id="menu-toggle" data-i18n-aria="openMenu" aria-label="開啟選單" aria-controls="drawer" aria-expanded="false">
          <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation drawer (MD3 modal), phones only -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="drawer__head">
      <h2 id="drawer-title" data-i18n="settings">設定</h2>
      <button type="button" class="icon-btn md-state" id="drawer-close" data-i18n-aria="closeMenu" aria-label="關閉">
        <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="drawer__body">
      <section class="drawer__section" aria-labelledby="drawer-lang">
        <h3 class="drawer__label" id="drawer-lang" data-i18n="langLabel">語言</h3>
        <button type="button" class="drawer-item md-state" data-lang-btn="zh-Hant" aria-pressed="false">
          <span class="label">繁體中文</span>
          <svg class="md-icon check" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
        <button type="button" class="drawer-item md-state" data-lang-btn="zh-Hans" aria-pressed="false">
          <span class="label">简体中文</span>
          <svg class="md-icon check" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
        <button type="button" class="drawer-item md-state" data-lang-btn="en" aria-pressed="false">
          <span class="label">English</span>
          <svg class="md-icon check" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
      </section>
      <section class="drawer__section" aria-labelledby="drawer-appearance">
        <h3 class="drawer__label" id="drawer-appearance" data-i18n="appearance">外觀</h3>
        <div class="drawer-item" role="switch" tabindex="0" aria-checked="false" data-theme-toggle-row>
          <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          <span class="label" data-i18n="darkMode">黑夜模式</span>
          <span class="md-switch" data-theme-switch aria-hidden="true"></span>
        </div>
      </section>
    </div>
  </aside>

  <main class="layout">
    <section class="card map-card">
      <div id="map" role="region" data-i18n-aria="mapAria" aria-label="香港18區地圖"></div>
      <div class="legend" aria-hidden="true">
        <span class="legend__item"><i style="background:#2e7d32"></i><span data-i18n="legendLow">低於 $40</span></span>
        <span class="legend__item"><i style="background:#8bc34a"></i><span data-i18n="legend2">$40–60</span></span>
        <span class="legend__item"><i style="background:#fdd835"></i><span data-i18n="legend3">$60–80</span></span>
        <span class="legend__item"><i style="background:#fb8c00"></i><span data-i18n="legend4">$80–150</span></span>
        <span class="legend__item"><i style="background:#e53935"></i><span data-i18n="legendHigh">高於 $150</span></span>
        <span class="legend__item"><i style="background:#bdbdbd"></i><span data-i18n="legendNone">暫無數據</span></span>
      </div>
    </section>

    <aside class="card list-card">
      <div class="list-card__head">
        <h2 data-i18n="listTitle">各區人均價</h2>
        <span class="hint" data-i18n="listHint">點選地圖或列表</span>
      </div>
      <ul id="district-list" class="district-list"></ul>
    </aside>

    <section class="card detail-card" id="detail" aria-live="polite">
      <div class="detail__placeholder">
        <h2 data-i18n="placeholderTitle">請選擇一個行政區</h2>
        <p data-i18n="placeholderText">點擊地圖上的圓點，或左側列表中的行政區，查看該區的餐廳與社交媒體貼文。</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footerDisclaimer">價格為搜尋結果摘要中提取的人均消費估算，僅供參考，並非官方數據。</p>
    <p class="footer__crawl" id="footer-crawl" data-i18n="loading">加載中…</p>
    <nav class="footer__links" aria-label="Links">
      <a class="text-btn md-state" href="https://baipon.com" target="_blank" rel="noopener noreferrer">
        <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg><span data-i18n="otherProjects">其他項目</span>
      </a>
      <a class="text-btn md-state" href="https://baipin.pw/donate" target="_blank" rel="noopener noreferrer">
        <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span data-i18n="donate">捐贈我們</span>
      </a>
      <a class="text-btn md-state" href="mailto:root@baipin.pw">
        <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg><span data-i18n="reportIssue">報告問題</span>
      </a>
    </nav>
    <p>
      <img class="footer__wcag" src="img/wcag2.2AA-blue.png" width="88" height="31"
        alt="符合萬維網聯盟有關無障礙網頁設計指引中2A級別的要求" data-i18n-alt="wcagAlt" />
    </p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
